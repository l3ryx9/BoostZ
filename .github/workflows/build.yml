name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer la release GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Clé de signature générée aléatoirement à chaque build (mot de passe aléatoire, jamais stocké).
      - name: Générer une clé de signature aléatoire
        shell: bash
        run: |
          KS="$RUNNER_TEMP/release.jks"
          PW="$(openssl rand -hex 24)"
          ALIAS="boostz$(openssl rand -hex 4)"
          echo "::add-mask::$PW"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=BoostZ $(openssl rand -hex 3)"
          {
            echo "BOOSTZ_KEYSTORE=$KS"
            echo "BOOSTZ_KEYSTORE_PASSWORD=$PW"
            echo "BOOSTZ_KEY_ALIAS=$ALIAS"
            echo "BOOSTZ_KEY_PASSWORD=$PW"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      # En cas d'échec : les vraies erreurs s'affichent en haut de la page du build (onglet Summary).
      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          {
            echo "## Erreurs du build"
            echo '```'
            grep -E "^e: |error:|AAPT|What went wrong|^> |Unresolved|Could not|R8" build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong|^> " build.log | head -80

      - name: Préparer la release
        id: meta
        shell: bash
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          APK="BoostZ-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: BoostZ ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.meta.outputs.apk }}
          body: |
            APK release de BoostZ, compilé automatiquement depuis le commit ${{ github.sha }}.

            Signé avec une clé générée aléatoirement pour ce build : pour installer cette version
            par-dessus une précédente, désinstallez d'abord l'ancienne.
